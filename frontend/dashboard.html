<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Spectroscopic Intelligence Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 16 Q5 8, 8 16 T14 16 T20 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="8" r="2.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand-text">Spectroscopic Intelligence</div>
      </div>
      <nav class="nav-menu" id="navMenu">
        <button class="nav-link active" data-page="dashboard">Dashboard</button>
        <button class="nav-link" data-page="onboarding">Project Setup Wizard</button>
        <button class="nav-link" data-page="projects">Projects</button>
        <button class="nav-link" data-page="monitoring">Monitoring Points</button>
        <button class="nav-link" data-page="parameters">Process Parameters</button>
        <button class="nav-link" data-page="checkout">Checkout Conditions</button>
        <button class="nav-link" data-page="rules">Regulatory Rules</button>
        <button class="nav-link" data-page="data-entry">Analytical Data</button>
        <button class="nav-link" data-page="gallery">Image Gallery</button>
        <button class="nav-link" data-page="compliance">Compliance Engine</button>
        <button class="nav-link" data-page="reports">Reports</button>
        <button class="nav-link" data-page="audit">Audit Trail</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Dashboard</h2>
          <div class="topbar-breadcrumb">Cloud-Connected Pharmaceutical QMS</div>
        </div>
        <div class="topbar-right">
          <div class="search-wrapper">
            <input id="globalSearch" type="search" placeholder="Search modules, projects, records..." />
          </div>
          <button class="button button--secondary" id="signOutButton">Sign Out</button>
        </div>
      </header>

      <section class="content-section content-section--active">
        <div class="card setup-progress-card" id="setupProgressCard">
          <div class="card-header">Setup Progress</div>
          <div class="setup-progress-bar-track"><div class="setup-progress-bar-fill" id="setupProgressFill" style="width:0%;"></div></div>
          <div class="setup-checklist" id="setupChecklist"></div>
        </div>
        <div class="grid grid--4cards">
          <article class="card card--metric">
            <div class="card-title">Total Projects</div>
            <div class="card-value" id="metricProjects">0</div>
          </article>
          <article class="card card--metric">
            <div class="card-title">Active Sessions</div>
            <div class="card-value" id="metricSessions">0</div>
          </article>
          <article class="card card--metric">
            <div class="card-title">Compliance Score</div>
            <div class="card-value" id="metricCompliance">0%</div>
          </article>
          <article class="card card--metric">
            <div class="card-title">Pending Deviations</div>
            <div class="card-value" id="metricDeviations">0</div>
          </article>
        </div>
        <div class="grid grid--cards">
          <article class="card card--chart">
            <div class="card-header">Critical Alerts</div>
            <div class="card-note" id="criticalAlerts">No critical alerts at the moment.</div>
          </article>
          <article class="card card--chart">
            <div class="card-header">Recent Reports</div>
            <ul class="report-list" id="dashboardReports"></ul>
          </article>
          <article class="card card--actions">
            <div class="card-header">Quick Actions</div>
            <div class="action-grid">
              <button class="mini-button" onclick="window.location.href='onboarding.html'">New Project</button>
              <button class="mini-button" onclick="window.location.href='monitoring.html'">Configure Points</button>
              <button class="mini-button" onclick="window.location.href='analytical.html'">Upload Data</button>
              <button class="mini-button" onclick="window.location.href='compliance.html'">Evaluate Compliance</button>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="modalPanel" class="modal hidden"></div>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
