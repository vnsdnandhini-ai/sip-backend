<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Points - Spectroscopic Intelligence Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 16 Q5 8, 8 16 T14 16 T20 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="8" r="2.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand-text">Spectroscopic Intelligence</div>
      </div>
                    <nav class="nav-menu" id="navMenu">
          <button class="nav-link" data-page="dashboard">Dashboard</button>
          <button class="nav-link" data-page="audit">Audit Log</button>
          <button class="nav-link" data-page="sensors">Sensor Data Entry</button>
          <button class="nav-link" data-page="batches">Medicine & Batch Type</button>
          <div class="nav-collapsible" id="navRegulationsGroup">
            <button type="button" class="nav-link nav-link--parent" id="navRegulationsToggle" aria-expanded="false">
              <span>Regulations & Standards</span>
              <svg class="chevron-icon" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
            <div class="nav-submenu" id="navRegulationsSubmenu">
              <button class="nav-link nav-link--sub" data-page="rules">Regulatory Rules</button>
              <button class="nav-link nav-link--sub" data-page="cgmp">cGMP Standards</button>
            </div>
          </div>
          <button class="nav-link" data-page="workflow">Process Workflow</button>
          <div class="nav-collapsible" id="navParametersGroup">
            <button type="button" class="nav-link nav-link--parent" id="navParametersToggle" aria-expanded="false">
              <span>Parameter & Checkout Conditions</span>
              <svg class="chevron-icon" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
            <div class="nav-submenu" id="navParametersSubmenu">
              <button class="nav-link nav-link--sub" data-page="parameters">Process Parameters</button>
              <button class="nav-link nav-link--sub" data-page="checkout">Checkout Conditions</button>
            </div>
          </div>
          <button class="nav-link" data-page="process-monitoring">Live Monitoring</button>
          <button class="nav-link" data-page="compliance">Compliance Engine</button>
          <button class="nav-link" data-page="reports">Quality Reports</button>
          <button class="nav-link" data-page="settings">Settings</button>
        </nav>

    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Monitoring Points</h2>
          <div class="topbar-breadcrumb">Cloud-Connected Pharmaceutical QMS</div>
        </div>
        <div class="topbar-right">
          <div class="search-wrapper">
            <input id="globalSearch" type="search" placeholder="Search modules, projects, records..." />
          </div>
          <button class="button button--secondary" id="signOutButton">Sign Out</button>
        </div>
      </header>

      <section class="content-section">
       <div class="section-header">
          <div>
            <h3>Monitoring Point Management</h3>
            <p>Define points of measurement across the manufacturing process. Use generic, configurable points.</p>
          </div>
          <button class="button button--primary" id="openMonitoringForm">Add Monitoring Point</button>
        </div>
        <div class="data-table-wrapper">
          <table class="data-table" id="monitoringTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Project</th>
                <th>Location</th>
                <th>Frequency</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Workflow Step Navigator Footer -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:12px;">
          <button class="button button--secondary" onclick="window.location.href='manufacturing-process.html'">
            ← Back to Process Workflow Studio
          </button>
          <button class="button button--primary" onclick="window.location.href='parameters.html'">
            Proceed to Process Parameters →
          </button>
        </div>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="modalPanel" class="modal hidden"></div>

  <script src="js/app.js"></script>
  <script src="js/monitoring.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
