<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectroscopic Intelligence Platform - Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <div id="login-screen" class="page page--active">
    <div class="login-panel">
      <div class="brand-panel">
        <div class="brand-mark">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M2 16 Q5 8, 8 16 T14 16 T20 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="8" r="2.5" fill="#ffffff"/>
  </svg>
</div>
        <h1>Spectroscopic Intelligence Platform</h1>
        <p>Secure cloud-connected platform for process monitoring, quality assurance, and compliance.</p>
      </div>
      <form id="login-form" class="login-form" autocomplete="off">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="Enter your username (e.g. admin)" value="admin" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Enter your password (e.g. admin)" value="admin" required />
        </div>
        <div class="form-actions" style="margin-top: 1rem;">
          <button type="submit" class="button button--primary" style="width: 100%;">Sign In to Platform</button>
        </div>
      </form>
      <div class="login-footnote" style="margin-top: 1.2rem; text-align: center;">
        <span style="font-size: 0.85rem; color: var(--muted);">Demo Access: <strong>admin</strong> / <strong>admin</strong></span>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
