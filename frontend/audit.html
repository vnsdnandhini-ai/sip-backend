<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Audit Log - Spectroscopic Intelligence Platform</title>
  
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 16 Q5 8, 8 16 T14 16 T20 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="8" r="2.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand-text">Spectroscopic Intelligence</div>
      </div>
            <nav class="nav-menu" id="navMenu">
        <button class="nav-link" data-page="audit">Audit Log</button>
        <button class="nav-link" data-page="sensors">Sensors & Hardware</button>
        <button class="nav-link" data-page="batches">Batch Management</button>
        <button class="nav-link" data-page="rules">Regulatory Rules</button>
        <button class="nav-link" data-page="cgmp">cGMP Standards</button>
        <button class="nav-link" data-page="workflow">Process Workflow</button>
        <button class="nav-link" data-page="monitoring">Monitoring Points</button>
        <button class="nav-link" data-page="parameters">Process Parameters</button>
        <button class="nav-link" data-page="dashboard">Live Monitoring</button>
        <button class="nav-link" data-page="data-entry">Analytical Data</button>
        <button class="nav-link" data-page="gallery">Image Gallery</button>
        <button class="nav-link" data-page="checkout">Checkout Conditions</button>
        <button class="nav-link" data-page="compliance">Compliance Engine</button>
        <button class="nav-link" data-page="reports">Quality Reports</button>
        <button class="nav-link" data-page="settings">Settings</button>
      </nav>

    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Audit Trail</h2>
          <div class="topbar-breadcrumb">Cloud-Connected Pharmaceutical QMS</div>
        </div>
        <div class="topbar-right">
          <div class="search-wrapper">
            <input id="globalSearch" type="search" placeholder="Search modules, projects, records..." />
          </div>
          <button class="button button--secondary" id="signOutButton">Sign Out</button>
        </div>
      </header>

      <section class="content-section">
                <div class="section-header">
          <div>
            <h3>Audit Log & Trail</h3>
            <p>21 CFR Part 11 compliant audit records. System events are automatically logged, but you can also record manual operational events here.</p>
          </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
          <div class="card-header">Log Manual Operation Event</div>
          <form id="manualAuditForm" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 16px;">
            <div class="form-group">
              <label>Operator / User</label>
              <input type="text" id="auditUser" placeholder="e.g. John Doe (QA Lead)" required>
            </div>
            <div class="form-group">
              <label>Module / Area</label>
              <input type="text" id="auditModule" placeholder="e.g. Cleanroom B" required>
            </div>
            <div class="form-group">
              <label>Activity Description</label>
              <input type="text" id="auditActivity" placeholder="e.g. Manual calibration of Sensor X" required>
            </div>
            <div style="grid-column: span 3;">
              <button type="submit" class="button button--primary">Record to Audit Trail</button>
            </div>
          </form>
        </div>
        <div class="data-table-wrapper">
          <table class="data-table" id="auditTable">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Activity</th>
                <th>Module</th>
                <th>User</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Workflow Step Navigator Footer -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:28px;padding-top:16px;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:12px;">
          <button class="button button--secondary" onclick="window.location.href='reports.html'">
            ← Back to Reports
          </button>
          <button class="button button--primary" onclick="window.location.href='dashboard.html'">
            Return to Dashboard ➔
          </button>
        </div>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="modalPanel" class="modal hidden"></div>

  <script src="js/app.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
