<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Trail - Spectroscopic Intelligence Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 16 Q5 8, 8 16 T14 16 T20 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="8" r="2.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand-text">Spectroscopic Intelligence</div>
      </div>
      <nav class="nav-menu" id="navMenu">
        <button class="nav-link" data-page="dashboard">Dashboard</button>
        <button class="nav-link" data-page="onboarding">Guided Setup</button>
        <button class="nav-link" data-page="projects">Projects</button>
        <button class="nav-link" data-page="monitoring">Monitoring Points</button>
        <button class="nav-link" data-page="parameters">Process Parameters</button>
        <button class="nav-link" data-page="checkout">Checkout Conditions</button>
        <button class="nav-link" data-page="rules">Regulatory Rules</button>
        <button class="nav-link" data-page="data-entry">Analytical Data</button>
        <button class="nav-link" data-page="gallery">Image Gallery</button>
        <button class="nav-link" data-page="compliance">Compliance Engine</button>
        <button class="nav-link" data-page="reports">Reports</button>
        <button class="nav-link active" data-page="audit">Audit Trail</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Audit Trail</h2>
          <div class="topbar-breadcrumb">Cloud-Connected Pharmaceutical QMS</div>
        </div>
        <div class="topbar-right">
          <div class="search-wrapper">
            <input id="globalSearch" type="search" placeholder="Search modules, projects, records..." />
          </div>
          <button class="button button--secondary" id="signOutButton">Sign Out</button>
        </div>
      </header>

      <section class="content-section">
        <div class="section-header">
          <div>
            <h3>Audit Trail</h3>
            <p>Complete audit records for login, configuration changes, uploads, report generation, and approvals.</p>
          </div>
        </div>
        <div class="data-table-wrapper">
          <table class="data-table" id="auditTable">
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Activity</th>
                <th>Module</th>
                <th>User</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="modalPanel" class="modal hidden"></div>

  <script src="js/app.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
