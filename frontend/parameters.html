<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Process Parameters - Spectroscopic Intelligence Platform</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 16 Q5 8, 8 16 T14 16 T20 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="20" cy="8" r="2.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand-text">Spectroscopic Intelligence</div>
      </div>
      <nav class="nav-menu" id="navMenu">
        <button class="nav-link" data-page="dashboard">Dashboard</button>
        <button class="nav-link" data-page="batches">Batch Management</button>
        <button class="nav-link" data-page="sensors">Sensors & Hardware</button>
        <button class="nav-link" data-page="workflow">Process Workflow</button>
        <button class="nav-link" data-page="monitoring">Monitoring Points</button>
        <button class="nav-link active" data-page="parameters">Process Parameters</button>
        <button class="nav-link" data-page="checkout">Checkout Conditions</button>
        <button class="nav-link" data-page="rules">Regulatory Rules</button>
        <button class="nav-link" data-page="data-entry">Analytical Data</button>
        <button class="nav-link" data-page="gallery">Image Gallery</button>
        <button class="nav-link" data-page="compliance">Compliance Engine</button>
        <button class="nav-link" data-page="cgmp">cGMP Standards</button>
        <button class="nav-link" data-page="reports">Reports & Audit</button>
        <button class="nav-link" data-page="settings">Settings</button>
      </nav>

    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="pageTitle">Process Parameters</h2>
          <div class="topbar-breadcrumb">Cloud-Connected Pharmaceutical QMS</div>
        </div>
        <div class="topbar-right">
          <div class="search-wrapper">
            <input id="globalSearch" type="search" placeholder="Search modules, projects, records..." />
          </div>
          <button class="button button--secondary" id="signOutButton">Sign Out</button>
        </div>
      </header>

      <section class="content-section">
       <div class="section-header">
          <div>
            <h3>Process Parameter Management</h3>
            <p>Configure analytical parameters, instruments, units, and sampling details.</p>
          </div>
          <button class="button button--primary" id="openParameterForm">Add Parameter</button>
        </div>
        <div class="data-table-wrapper">
          <table class="data-table" id="parametersTable">
            <thead>
              <tr>
              <th>Parameter</th>
<th>Monitoring Point</th>
<th>Instrument</th>
                <th>Unit</th>
                <th>Frequency</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <!-- Workflow Step Navigator Footer -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid #e2e8f0;flex-wrap:wrap;gap:12px;">
          <button class="button button--secondary" onclick="window.location.href='monitoring.html'">
            ← Back to Monitoring Points
          </button>
          <button class="button button--primary" onclick="window.location.href='checkout.html'">
            Proceed to Checkout Conditions →
          </button>
        </div>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="modalPanel" class="modal hidden"></div>

  <script src="js/app.js"></script>
  <script src="js/parameters.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
